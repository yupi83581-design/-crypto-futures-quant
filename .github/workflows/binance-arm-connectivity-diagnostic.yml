name: binance-arm-connectivity-diagnostic

on:
  push:
    branches:
      - agent/phase13-audit
    paths:
      - ".github/workflows/binance-arm-connectivity-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Probe Binance Futures REST
        run: |
          set +e
          for url in             "https://fapi.binance.com/fapi/v1/ping"             "https://fapi.binance.com/fapi/v1/time"             "https://fstream.binance.com"; do
            echo "=== $url ==="
            curl -sS -L --max-time 10 -o /tmp/response -w "HTTP %{http_code} remote=%{remote_ip} size=%{size_download}\n" "$url"
            rc=$?
            echo "curl_exit=$rc"
            if [ -s /tmp/response ]; then head -c 500 /tmp/response; echo; fi
          done

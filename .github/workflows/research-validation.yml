name: research-validation-evidence

on:
  push:
    branches:
      - agent/phase13-audit
    paths:
      - "src/research/**"
      - "src/backtest/**"
      - "src/models/**"
      - "src/features/**"
      - "src/labels/**"
      - "scripts/run_research_validation.py"
      - "tests/research/**"
      - "tests/backtest/**"
      - ".github/workflows/research-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase13-audit
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run research unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/research tests/backtest -q

      - name: Generate historical validation evidence
        id: validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python scripts/run_research_validation.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record validation evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/research_validation.json evidence/final_validation.json
          git diff --cached --quiet || git commit -m "Record research validation evidence"
          git push origin HEAD:agent/phase13-audit

      - name: Enforce final validation status
        if: steps.validation.outputs.status != '0'
        run: |
          echo "Research validation did not reach PASS. Evidence was recorded; inspect evidence/final_validation.json."
          exit 1

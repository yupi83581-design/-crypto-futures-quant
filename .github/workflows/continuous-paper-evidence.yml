name: continuous-paper-evidence

on:
  push:
    branches:
      - agent/phase13-audit
    paths:
      - "scripts/collect_paper_evidence.py"
      - ".github/workflows/continuous-paper-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continuous-paper-evidence
  cancel-in-progress: false

jobs:
  paper-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase13-audit
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect real paper cycles
        run: |
          set -e
          for cycle in $(seq 1 12); do
            echo "=== REAL PAPER CYCLE $cycle/12 ==="
            python scripts/collect_paper_evidence.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add evidence/paper_state.json evidence/paper_trading.jsonl
            git diff --cached --quiet || git commit -m "Record real paper-trading evidence cycle $cycle"
            git push origin HEAD:agent/phase13-audit
            if [ "$cycle" -lt 12 ]; then sleep 300; fi
          done

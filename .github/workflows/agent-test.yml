name: Agent temporary test

on:
  push:
    branches:
      - agent/phase13-audit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest jsonschema
      - run: pytest -q tests/production
      - run: pytest -q

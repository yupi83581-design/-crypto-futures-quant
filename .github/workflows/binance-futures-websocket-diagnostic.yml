name: binance-futures-websocket-diagnostic

on:
  push:
    branches:
      - agent/phase13-audit
    paths:
      - ".github/workflows/binance-futures-websocket-diagnostic.yml"

permissions:
  contents: read

jobs:
  websocket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Binance Futures WebSocket
        run: |
          python -m pip install -q websocket-client
          python - <<'PY'
          import json
          import websocket

          urls = [
              "wss://fstream.binance.com/ws/btcusdt@kline_5m",
              "wss://fstream.binance.com/ws/btcusdt@depth20@100ms",
          ]
          for url in urls:
              print("=== " + url + " ===")
              ws = websocket.create_connection(url, timeout=15)
              try:
                  message = json.loads(ws.recv())
                  print(json.dumps({
                      "event": message.get("e"),
                      "stream_symbol": message.get("s"),
                      "event_time": message.get("E"),
                      "closed": message.get("k", {}).get("x"),
                      "best_bid": message.get("b"),
                      "best_ask": message.get("a"),
                  }))
              finally:
                  ws.close()
          PY

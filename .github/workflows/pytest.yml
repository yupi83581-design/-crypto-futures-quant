name: pytest

on:
  push:
    branches:
      - agent/phase13-audit
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run targeted bridge and final-gate tests
        run: python -m pytest -q tests/production/test_snapshot_bridge.py tests/production/test_command_center_contract.py tests/integration/test_phase13_phase14_final_gate.py tests/research/test_final_validation.py
      - name: Run full regression
        run: python -m pytest -q

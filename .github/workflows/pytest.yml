name: pytest

on:
  push:
    branches:
      - agent/phase13-audit
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run targeted bridge, runtime, and final-gate tests
        run: python -m pytest -q tests/production/test_snapshot_bridge.py tests/production/test_command_center_contract.py tests/production/test_runtime.py tests/integration/test_phase13_phase14_final_gate.py tests/research/test_final_validation.py
      - name: Run full regression
        run: python -m pytest -q
      - name: Run real Binance market-data integration evidence
        continue-on-error: true
        env:
          RUN_REAL_DATA_INTEGRATION: "1"
        run: python -m pytest -q tests/integration/test_binance_live.py
      - name: Run real Binance runtime-to-snapshot integration evidence
        continue-on-error: true
        env:
          RUN_REAL_DATA_INTEGRATION: "1"
        run: python -m pytest -q tests/integration/test_runtime_live.py

  quant-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase13-audit
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run DSR and CSCV mathematical tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/research/test_dsr.py tests/research/test_pbo.py tests/backtest/test_backtest_engine.py
      - name: Audit existing 12-cycle paper evidence
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/audit_paper_evidence.py > evidence/paper_evidence_audit.json || true
      - name: Run official Binance Vision historical validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_phase10_backtest.py \
            --symbol BTCUSDT \
            --start 2025-01-01T00:00:00Z \
            --end 2026-09-23T00:00:00Z \
            --output evidence/phase10_backtest.json
      - name: Verify quantitative evidence
        run: |
          test -s evidence/phase10_backtest.json
          python - <<'PY'
          import json
          p=json.load(open("evidence/phase10_backtest.json"))
          assert p["source"].startswith("Binance Vision official")
          assert p["data_integrity"]["passed"] is True
          assert p["untouched_final_test"]["untouched"] is True
          assert p["dsr"]["trial_count"] == 7
          assert p["pbo_cscv"]["path_count"] > 0
          assert p["real_money_execution"] is False
          print(json.dumps({"wfo":p["trading_performance_wfo"],"final_test":p["untouched_final_test"]["performance"],"dsr":p["dsr"],"pbo_cscv":p["pbo_cscv"]}, indent=2))
          PY
      - name: Commit quantitative evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/phase10_backtest.json
          git diff --cached --quiet || git commit -m "Record quantitative validation evidence"
          git push origin HEAD:agent/phase13-audit

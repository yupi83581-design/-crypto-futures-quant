name: pytest

on:
  push:
    branches:
      - agent/phase13-audit
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Binance endpoint reachability
        continue-on-error: true
        run: |
          set +e
          for url in \
            "https://fapi.binance.com/fapi/v1/ping" \
            "https://fapi.binance.com/fapi/v1/time" \
            "https://fstream.binance.com" \
            "https://data-api.binance.vision/api/v3/ping"; do
            echo "=== $url ==="
            curl -sS -L --max-time 10 -o /tmp/response -w "HTTP %{http_code} remote=%{remote_ip} size=%{size_download}\\n" "$url"
            rc=$?
            echo "curl_exit=$rc"
            if [ -s /tmp/response ]; then head -c 500 /tmp/response; echo; fi
          done
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run targeted bridge, runtime, and final-gate tests
        run: python -m pytest -q tests/production/test_snapshot_bridge.py tests/production/test_command_center_contract.py tests/production/test_runtime.py tests/integration/test_phase13_phase14_final_gate.py tests/research/test_final_validation.py
      - name: Run full regression
        run: python -m pytest -q
      - name: Run real Binance market-data integration evidence
        continue-on-error: true
        env:
          RUN_REAL_DATA_INTEGRATION: "1"
        run: python -m pytest -q tests/integration/test_binance_live.py
      - name: Run real Binance runtime-to-snapshot integration evidence
        continue-on-error: true
        env:
          RUN_REAL_DATA_INTEGRATION: "1"
        run: python -m pytest -q tests/integration/test_runtime_live.py

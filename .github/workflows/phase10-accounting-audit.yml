name: phase10-accounting-audit

on:
  push:
    branches:
      - agent/phase13-audit
    paths:
      - "scripts/audit_phase10_accounting.py"
      - "scripts/run_phase10_backtest.py"
      - "src/**"
      - "evidence/phase10_backtest.json"
      - ".github/workflows/phase10-accounting-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase10-accounting-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase13-audit
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run forensic accounting audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/audit_phase10_accounting.py
      - name: Archive audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase10-accounting-audit-${{ github.run_id }}
          path: evidence/phase10_accounting_audit.json
          if-no-files-found: error

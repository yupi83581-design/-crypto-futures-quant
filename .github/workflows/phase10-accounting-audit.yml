name: phase10-accounting-audit

on:
  push:
    branches:
      - agent/phase13-audit
    paths:
      - "scripts/audit_phase10_accounting.py"
      - "scripts/run_phase10_backtest.py"
      - "src/**"
      - "evidence/phase10_backtest.json"
      - ".github/workflows/phase10-accounting-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase10-accounting-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase13-audit
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run forensic accounting audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/audit_phase10_accounting.py
      - name: Persist audit artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/phase10_accounting_audit.json
          git diff --cached --quiet || git commit -m "Record Phase 10 accounting audit"
          git push origin HEAD:agent/phase13-audit
